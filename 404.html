<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Guangyi Zou</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .not-found { min-height: 100vh; display: grid; place-items: center; padding: 2rem; text-align: center; }
    .not-found-inner { max-width: 680px; }
    .not-found-code { margin: 0 0 1rem; color: var(--warm); font-family: var(--mono); font-size: 0.85rem; letter-spacing: .12em; }
    .not-found h1 { margin-bottom: 1rem; font-size: clamp(3rem, 10vw, 7rem); }
    .not-found p { margin-bottom: 2rem; }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found-inner">
      <p class="not-found-code">ERROR 404</p>
      <h1>Page not found.</h1>
      <p>The page may have moved, or the address may be incorrect.</p>
      <a class="button button-primary" href="./">Return home</a>
    </div>
  </main>
</body>
</html>
