<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="title desc">
  <title id="title">Guangyi Zou monogram</title>
  <desc id="desc">An abstract academic portrait featuring the initials GZ and a random-matrix inspired grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c5a54"/>
      <stop offset="1" stop-color="#083f3b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.95">
      <stop offset="0" stop-color="#e9b18a" stop-opacity="0.7"/>
      <stop offset="0.48" stop-color="#e9b18a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#e9b18a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M58 0H0V58" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="6" cy="6" r="2.3" fill="#fff" fill-opacity="0.32"/>
    </pattern>
  </defs>
  <rect width="640" height="760" fill="url(#bg)"/>
  <rect width="640" height="760" fill="url(#glow)"/>
  <rect x="28" y="28" width="584" height="704" rx="240" fill="url(#grid)"/>
  <path d="M-30 606C124 510 232 662 352 565C445 490 493 413 680 470" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M-15 636C135 540 243 692 367 595C458 524 514 448 671 502" fill="none" stroke="#e9b18a" stroke-opacity="0.55" stroke-width="3"/>
  <circle cx="466" cy="176" r="96" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="466" cy="176" r="54" fill="none" stroke="#e9b18a" stroke-opacity="0.38" stroke-width="2"/>
  <text x="320" y="418" text-anchor="middle" fill="#f9f5ed" font-family="Georgia, 'Times New Roman', serif" font-size="190" font-weight="600" letter-spacing="-20">GZ</text>
  <text x="320" y="482" text-anchor="middle" fill="#f9f5ed" fill-opacity="0.72" font-family="Arial, sans-serif" font-size="22" letter-spacing="7">MATHEMATICS</text>
</svg>
